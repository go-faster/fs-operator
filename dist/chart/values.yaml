## Global values shared across the chart.
##
global:
  ## Registry host for air-gapped or mirrored deployments. When set, the
  ## registry host of every image is replaced with this value — both the
  ## operator image below and the fs node image the operator deploys into
  ## each FSCluster:
  ##   ghcr.io/go-faster/fs-operator -> <imageRegistry>/go-faster/fs-operator
  ##   ghcr.io/go-faster/fs          -> <imageRegistry>/go-faster/fs
  ## Leave empty to pull each image from its own registry.
  ##
  imageRegistry: ""

## String to partially override chart.fullname template (will maintain the release name)
##
# nameOverride: ""

## String to fully override chart.fullname template
##
# fullnameOverride: ""

## Configure the controller manager deployment
##
manager:
  ## Set to false to skip manager installation
  ##
  enabled: true

  replicas: 1

  image:
    repository: ghcr.io/go-faster/fs-operator
    ## Image tag (defaults to Chart.appVersion if not set)
    ##
    # tag: ""
    ## Pin the image by content instead of by tag, as "sha256:<hex>". Wins
    ## over tag; global.imageRegistry still applies, so a mirrored image
    ## stays pinned. A digest written into repository works too.
    ##
    # digest: ""
    pullPolicy: IfNotPresent

  ## Arguments
  ##
  args:
    - --leader-elect

  ## Image pull secrets
  ##
  # imagePullSecrets:
  #   - name: myregistrykey

  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  ## Container-level security settings
  ##
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  ## Resource limits and requests
  ##
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  ## Manager pod's affinity
  ##
  affinity: {}

  ## Manager pod's node selector
  ##
  nodeSelector: {}

  ## Manager pod's tolerations
  ##
  tolerations: []

  ## Deployment strategy
  ##
  # strategy:
  #   type: RollingUpdate
  #   rollingUpdate:
  #     maxSurge: 25%
  #     maxUnavailable: 25%

  ## Priority class name
  ##
  # priorityClassName: ""

  ## Topology spread constraints
  ##
  # topologySpreadConstraints: []

  ## Termination grace period seconds
  ##
  terminationGracePeriodSeconds: 10

  ## Custom Deployment labels
  ##
  # labels: {}

  ## Custom Deployment annotations
  ##
  # annotations: {}

  ## Custom Pod labels and annotations
  ##
  # pod:
  #   labels: {}
  #   annotations: {}

## RBAC configuration
##
rbac:
  ## RBAC resource scope
  ## - false (default): ClusterRole/ClusterRoleBinding (all namespaces)
  ## - true: Role/RoleBinding (release namespace only)
  ##
  namespaced: false

  ## Helper roles for CRD management (admin/editor/viewer)
  ##
  helpers:
    ## Install convenience admin/editor/viewer roles for CRDs
    ##
    enabled: false

## ServiceAccount configuration
##
serviceAccount:
  # Install default ServiceAccount provided
  enabled: true

  ## Existing ServiceAccount name (only when enabled=false)
  ## Note: When enabled=true, respects nameOverride/fullnameOverride
  ##
  # name: ""

  ## Custom ServiceAccount annotations
  ##
  # annotations: {}

  ## Custom ServiceAccount labels
  ##
  # labels: {}

## Custom Resource Definitions
##
crd:
  # Install CRDs with the chart
  enabled: true
  # Keep CRDs when uninstalling
  keep: true

## Controller metrics endpoint.
## Enable to expose /metrics endpoint
##
metrics:
  enabled: true
  # Metrics server port
  port: 8443
  # Enable secure metrics: HTTPS with certs/auth (true) or HTTP (false).
  # Note: Metrics authn/authz needs ClusterRole access.
  secure: true

## Validating admission webhook: rejects an FSCluster whose spec cannot work
## at apply time, instead of storing it and letting the operator refuse it.
## Needs a serving certificate the API server trusts, which is why it is
## opt-in — either cert-manager (certManager.enabled) or a Secret you supply.
##
webhook:
  enabled: false
  ## Fail is deliberate: these checks are what stands between a typo and a
  ## cluster that cannot host its own data. Ignore admits specs unchecked when
  ## the webhook is unreachable; the controller still refuses them, but by then
  ## the object is stored.
  failurePolicy: Fail
  ## Bring your own certificate instead of cert-manager: the name of a Secret
  ## with tls.crt/tls.key, plus the base64 CA bundle to put in the webhook
  ## configuration. Leave both empty to let cert-manager issue one.
  certSecretName: ""
  caBundle: ""

## Cert-manager integration for TLS certificates.
## Required for webhook certificates and metrics endpoint certificates.
##
certManager:
  enabled: false

## Prometheus ServiceMonitor for metrics scraping.
## Requires prometheus-operator to be installed in the cluster.
##
prometheus:
  enabled: false

## Grafana dashboard for the operator's metrics, shipped as a ConfigMap the
## Grafana sidecar discovers by label. Needs `prometheus.enabled` (or some
## other scrape path) to have anything to show.
##
grafanaDashboard:
  enabled: false
  ## The label the Grafana sidecar watches for. kube-prometheus-stack uses
  ## grafana_dashboard="1"; other deployments differ, so it is configurable.
  labels:
    grafana_dashboard: "1"
  annotations: {}
  ## Namespace to put the ConfigMap in. Empty means the release namespace;
  ## set it when the sidecar only watches its own.
  namespace: ""

## Network policies for controlling traffic flow.
## Enable to restrict ingress to the controller manager.
##
networkPolicy:
  enabled: false

