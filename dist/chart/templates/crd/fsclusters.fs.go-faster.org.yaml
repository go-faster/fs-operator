                      repair queue drained). On timeout the rollout halts — it never
                      proceeds to another node while the cluster is unconverged — and
                      resumes automatically when the gate passes.
                    type: string
                  schemaMigration:
                    default: Auto
                    description: |-
                      schemaMigration selects whether the operator runs `fs cluster migrate`
                      automatically after a successful full rollout (Auto) or only surfaces
                      the pending migration via the SchemaCurrent condition (Manual).
                    enum:
                    - Auto
                    - Manual
                    type: string
                type: object
            required:
            - etcd
            - storage
            - topology
            type: object
            x-kubernetes-validations:
            - message: 'clusterSecretRef is immutable: it cannot be added or removed'
              rule: has(self.clusterSecretRef) == has(oldSelf.clusterSecretRef)
          status:
            description: status defines the observed state of FSCluster
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the FSCluster. See the
                  documented condition types (SpecValid, ReconcileSucceeded, Ready,
                  NodesHealthy, ClusterSizeAligned, ConfigurationInSync, Converged,
                  SchemaCurrent).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              configurationRevision:
                description: configurationRevision is the hash of the desired rendered
                  configs.
                type: string
              currentRevision:
                description: currentRevision is the revision every node has converged
                  to.
                type: string
              endpoints:
                description: endpoints are the cluster's client endpoints.
                properties:
                  s3:
                    description: s3 is the in-cluster S3 endpoint URL.
                    type: string
                type: object
              nodes:
                description: nodes is the desired node count.
                format: int32
                type: integer
              observedGeneration:
                description: |-
                  observedGeneration is the last spec generation the controller acted
                  on.
                format: int64
                type: integer
              readyNodes:
                description: readyNodes is the number of node pods that are Ready.
                format: int32
                type: integer
              rebalance:
                description: rebalance summarizes rebalance/repair across nodes.
                properties:
                  repairQueueDepth:
                    description: repairQueueDepth is the summed pending repair tasks
                      across nodes.
                    format: int64
                    type: integer
                  state:
                    description: state is the worst rebalance state across nodes.
                    type: string
                type: object
              registeredNodes:
                description: registeredNodes is the number of nodes present in the
                  etcd topology.
                format: int32
                type: integer
              schemaVersion:
                description: schemaVersion reports the fs schema versions in play.
                properties:
                  binary:
                    description: binary is the schema version the deployed image implements.
                    format: int64
                    type: integer
                  cluster:
                    description: cluster is the schema version recorded in etcd.
                    format: int64
                    type: integer
                type: object
              statefulSetRevision:
                description: statefulSetRevision is the hash of the desired pod templates.
                type: string
              update:
                description: update is present while a rolling change is in flight.
                properties:
                  node:
                    description: node is the node currently being replaced.
                    type: string
                  phase:
                    description: phase is the state-machine phase.
                    enum:
                    - Preflight
                    - RollingNodes
                    - Migrating
                    type: string
                  startedAt:
                    description: startedAt is when the rolling change started.
                    format: date-time
                    type: string
                type: object
              updateRevision:
                description: updateRevision is the revision being rolled out.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
