                          repository:
                            default: quay.io/coreos/etcd
                            description: repository is the etcd image repository.
                            type: string
                          tag:
                            default: v3.5.17
                            description: tag is the etcd image tag.
                            minLength: 1
                            type: string
                        type: object
                      replicas:
                        description: |-
                          replicas is the etcd member count: 1 for a laptop, 3 for a demo that
                          should survive a node restart. Even counts cannot form a quorum and are
                          refused. Immutable, because this etcd has no member-replacement path:
                          growing it would need a join dance the operator does not implement.
                        enum:
                        - 1
                        - 3
                        format: int32
                        type: integer
                        x-kubernetes-validations:
                        - message: etcd.managed.replicas is immutable
                          rule: self == oldSelf
                      resources:
                        description: resources are the etcd container's resource requirements.
                        properties:
                          claims:
                            description: |-
                              Claims lists the names of resources, defined in spec.resourceClaims,
                              that are used by this container.

                              This field depends on the
                              DynamicResourceAllocation feature gate.

                              This field is immutable. It can only be set for containers.
                            items:
                              description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                              properties:
                                name:
                                  description: |-
                                    Name must match the name of one entry in pod.spec.resourceClaims of
                                    the Pod where this field is used. It makes that resource available
                                    inside a container.
                                  type: string
                                request:
                                  description: |-
                                    Request is the name chosen for a request in the referenced claim.
                                    If empty, everything from the claim is made available, otherwise
                                    only the result of this request.
                                  type: string
                              required:
                              - name
                              type: object
                            type: array
                            x-kubernetes-list-map-keys:
                            - name
                            x-kubernetes-list-type: map
                          limits:
                            additionalProperties:
                              anyOf:
                              - type: integer
                              - type: string
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            description: |-
                              Limits describes the maximum amount of compute resources allowed.
                              More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                            type: object
                          requests:
                            additionalProperties:
                              anyOf:
                              - type: integer
                              - type: string
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            description: |-
                              Requests describes the minimum amount of compute resources required.
                              If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                              otherwise to an implementation-defined value. Requests cannot exceed Limits.
                              More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                            type: object
                        type: object
                      storage:
                        description: |-
                          storage sizes each member's volume. etcd holds only control-plane
                          state — the node registry, cursors, the sealed key store — so this is
                          kilobytes of data with room for history and compaction.
                        properties:
                          reclaimPolicy:
                            default: Delete
                            description: |-
                              reclaimPolicy decides what happens to the members' volumes when the
