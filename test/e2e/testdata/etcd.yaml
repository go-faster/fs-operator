# A three-member etcd for the e2e cluster: the smallest control plane that
# still exercises the real thing (leases, watches, an elected migration lock).
#
# It is deliberately not production shaped — memory-backed storage, no TLS, no
# backups — and exists only so the operator has an etcd to point fs at. The
# operator itself never manages etcd (SPEC §2).
apiVersion: v1
kind: Service
metadata:
  name: etcd-peers
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: etcd
  ports:
    - name: client
      port: 2379
    - name: peer
      port: 2380
---
apiVersion: v1
kind: Service
metadata:
  name: etcd
spec:
  selector:
    app: etcd
  ports:
    - name: client
      port: 2379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
spec:
  serviceName: etcd-peers
  replicas: 3
  # All three members start together: the default OrderedReady policy waits
  # for etcd-0 to be ready, and a single member cannot reach quorum on its
  # own — the cluster would never bootstrap.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.17
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          command:
            - /usr/local/bin/etcd
            - --name=$(POD_NAME)
            - --data-dir=/var/run/etcd
            - --listen-client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://$(POD_NAME).etcd-peers.$(NAMESPACE).svc:2379
            - --listen-peer-urls=http://0.0.0.0:2380
            - --initial-advertise-peer-urls=http://$(POD_NAME).etcd-peers.$(NAMESPACE).svc:2380
            - --initial-cluster-token=fs-operator-e2e
            - --initial-cluster-state=new
            - --initial-cluster=etcd-0=http://etcd-0.etcd-peers.$(NAMESPACE).svc:2380,etcd-1=http://etcd-1.etcd-peers.$(NAMESPACE).svc:2380,etcd-2=http://etcd-2.etcd-peers.$(NAMESPACE).svc:2380
          ports:
            - name: client
              containerPort: 2379
            - name: peer
              containerPort: 2380
          readinessProbe:
            httpGet:
              path: /readyz
              port: client
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/run/etcd
      volumes:
        - name: data
          emptyDir: {}
