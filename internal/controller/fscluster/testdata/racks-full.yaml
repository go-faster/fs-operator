# Rendered by fs-operator for node prod-a-0 of FSCluster tenant-a/prod. Do not edit.
server:
  addr: :8080
  read_timeout: 1m0s
  write_timeout: 2m0s
  idle_timeout: 5m0s
  health_path: /health
  tls:
    cert_file: /etc/fs/tls/tls.crt
    key_file: /etc/fs/tls/tls.key
storage:
  root: /var/lib/fs
  type: cluster
auth:
  keys:
    - access_key: AKbackup
      secret_key: backup-secret-key-0123456789
      grants:
        - bucket: backups
          permission: admin
        - bucket: public
          permission: read
    - access_key: AKmedia
      secret_key: media-secret-key-0123456789
      grants:
        - bucket: media-*
          permission: write
  public_read_buckets:
    - public
    - assets
admin:
  enabled: true
  addr: :8090
cluster:
  node_id: prod-a-0
  rack: a
  addr: :7080
  advertise_addr: prod-a-0-0.prod-peers.tenant-a.svc:7080
  scheme: ec:4,2
  disks:
    - id: d0
      path: /var/lib/fs/disks/d0
      weight: 1
    - id: d1
      path: /var/lib/fs/disks/d1
      weight: 0.5
  etcd:
    endpoints:
      - http://etcd-0.etcd.fs-system:2379
      - http://etcd-1.etcd.fs-system:2379
      - http://etcd-2.etcd.fs-system:2379
    prefix: /fs/prod
    ttl: 15s
  rebalance:
    settle: 2m0s
    cooldown: 30m0s
    full_watermark: 0.85
integrity:
  verify_on_read: true
  scrub_interval: 12h0m0s
  scrub_quarantine: true
observability:
  service_name: prod
  enable_request_logging: true
  enable_metrics: true
  enable_tracing: true
