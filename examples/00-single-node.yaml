# Single-node development cluster: one fs node, one volume, nothing else — no
# peers, no layout, no replication. It fits a laptop kind/minikube cluster and
# needs nothing else in the namespace.
#
# DEVELOPMENT ONLY. One copy of every object on one volume: no repair, no
# failure tolerance. Losing the node loses the data. It also cannot be grown
# into a cluster in place, so anything you keep starts at three nodes: see
# 01-minimal.yaml and 07-production.yaml.
apiVersion: fs.go-faster.org/v1alpha1
kind: FSCluster
metadata:
  name: fs-dev
spec:
  topology:
    # One node is the single-node shape; two is refused, three is the
    # smallest cluster.
    nodes: 1
  storage:
    size: 5Gi
