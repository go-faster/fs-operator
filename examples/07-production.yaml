# Full production shape: three zonal racks, resource requests/limits, a
# PodMonitor for Prometheus, a NetworkPolicy locking down the peer and admin
# ports, and strict anti-affinity so no two fs nodes share a Kubernetes node.
apiVersion: fs.go-faster.org/v1alpha1
kind: FSCluster
metadata:
  name: fs-prod
spec:
  # image is omitted: it defaults to the pinned fs release this operator
  # version is validated against (bump it in one place with `make fs-version`).
  topology:
    racks:
      - name: a
        nodes: 2
        zone: eu-central-1a
      - name: b
        nodes: 2
        zone: eu-central-1b
      - name: c
        nodes: 2
        zone: eu-central-1c
    # Strict: refuse to co-locate two fs nodes on one Kubernetes node.
    podAntiAffinity: Required
  storage:
    size: 1Ti
    storageClass: fast-nvme
  s3:
    service:
      type: LoadBalancer
  # Restrict the peer (7080) and admin (8090) ports to cluster pods and the
  # operator; S3 stays reachable.
  networkPolicy: true
  observability:
    logLevel: info
    podMonitor: true
  podTemplate:
    resources:
      requests:
        cpu: "2"
        memory: 4Gi
      limits:
        memory: 8Gi
    priorityClassName: high-priority
