# Minimal development cluster: 3 flat nodes (each its own failure domain),
# one 10Gi volume per node, relaxed anti-affinity so it fits a small cluster.
# Nothing else is needed: the nodes find each other and the operator applies
# the layout once all three are up.
#
# This is a dev shape: for production see 07-production.yaml.
apiVersion: fs.go-faster.org/v1alpha1
kind: FSCluster
metadata:
  name: fs-dev
spec:
  # image is omitted: it defaults to the pinned fs release this operator
  # version is validated against.
  topology:
    nodes: 3
    # Dev only: allows several fs nodes on one Kubernetes node.
    podAntiAffinity: Preferred
  storage:
    size: 10Gi
