# Zonal topology: three racks (failure domains) of two nodes, each rack pinned
# to one availability zone. Every node joins the layout with its rack's zone,
# and fs spreads the three copies of each partition over zones first, so the
# cluster survives a full zone loss.
apiVersion: fs.go-faster.org/v1alpha1
kind: FSCluster
metadata:
  name: fs-zonal
spec:
  # image is omitted: it defaults to the pinned fs release this operator
  # version is validated against (bump it in one place with `make fs-version`).
  topology:
    racks:
      - name: a
        nodes: 2
        zone: eu-central-1a
      - name: b
        nodes: 2
        zone: eu-central-1b
      - name: c
        nodes: 2
        zone: eu-central-1c
  storage:
    size: 200Gi
    storageClass: fast-nvme
