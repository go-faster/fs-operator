# This rule is not used by the project fs-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to fs.go-faster.org resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: fs-operator
    app.kubernetes.io/managed-by: kustomize
  name: fsaccesskey-viewer-role
rules:
- apiGroups:
  - fs.go-faster.org
  resources:
  - fsaccesskeys
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - fs.go-faster.org
  resources:
  - fsaccesskeys/status
  verbs:
  - get
