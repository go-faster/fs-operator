---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-fs-go-faster-org-v1alpha1-fscluster
  failurePolicy: Fail
  name: vfscluster.kb.io
  rules:
  - apiGroups:
    - fs.go-faster.org
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - fsclusters
  sideEffects: None
