# The webhook's clientConfig.service is a name reference kustomize has to
# rewrite when the namespace or the name prefix changes, and its namespace
# field is not one kustomize should prefix.
nameReference:
- kind: Service
  version: v1
  fieldSpecs:
  - kind: ValidatingWebhookConfiguration
    group: admissionregistration.k8s.io
    path: webhooks/clientConfig/service/name

namespace:
- kind: ValidatingWebhookConfiguration
  group: admissionregistration.k8s.io
  path: webhooks/clientConfig/service/namespace
  create: true
