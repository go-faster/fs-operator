apiVersion: fs.go-faster.org/v1alpha1
kind: FSCluster
metadata:
  labels:
    app.kubernetes.io/name: fs-operator
    app.kubernetes.io/managed-by: kustomize
  name: fscluster-sample
spec:
  image:
    tag: latest
  topology:
    nodes: 3
    podAntiAffinity: Preferred
  storage:
    disks:
      - name: d0
        size: 10Gi
  etcd:
    external:
      endpoints:
        - http://etcd.default.svc:2379
