name: Tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # The CRD compatibility check compares against the last release tag,
          # which a shallow clone does not have.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          make test

      - name: Generated artifacts are in sync
        # The owned chart carries generated copies (CRDs, the manager RBAC)
        # that must not drift from config/. A stale manager role is not a lint
        # failure — it is an operator that starts, cannot list what it owns,
        # and silently never reconciles — so the check runs on every PR, not
        # only at release. The fs pin must also be spelled the same
        # everywhere (SPEC §14, §8.2).
        run: |
          make manifests generate helm-sync-crds
          git diff --exit-code config dist/chart api
          make check-fs-version

      - name: The API reference matches the types
        # docs/reference/api.md is generated from the field comments in api/,
        # so a new field is documented by the act of commenting it — and an
        # uncommented one shows up here rather than as a blank cell someone
        # notices months later (SPEC §13).
        run: |
          make docs-api-ref
          git diff --exit-code docs/reference/api.md

      - name: CRDs stay compatible with what is already stored
        # The CRDs are the operator's API. Dropping a field prunes it out of
        # stored objects, and tightening a rule leaves objects the API server
        # refuses on the next write — a cluster that reconciles fine until
        # someone edits something unrelated. Additive changes pass silently.
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
          make check-crd-compat
