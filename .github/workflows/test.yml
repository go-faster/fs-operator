name: Tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          make test

      - name: Generated artifacts are in sync
        # The owned chart carries generated copies (CRDs, the manager RBAC)
        # that must not drift from config/. A stale manager role is not a lint
        # failure — it is an operator that starts, cannot list what it owns,
        # and silently never reconciles — so the check runs on every PR, not
        # only at release. The fs pin must also be spelled the same
        # everywhere (SPEC §14, §8.2).
        run: |
          make manifests generate helm-sync-crds
          git diff --exit-code config dist/chart api
          make check-fs-version
