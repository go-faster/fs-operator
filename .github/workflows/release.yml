name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  image:
    name: Publish operator image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push the multi-arch image
        run: |
          # Cross-compile in a native builder stage (the Dockerfile builds
          # with CGO_ENABLED=0 and GOARCH=$TARGETARCH), so no emulation is
          # needed for either platform.
          sed -e '1 s/\(^FROM\)/FROM --platform=\${BUILDPLATFORM}/; t' \
              -e ' 1,// s//FROM --platform=\${BUILDPLATFORM}/' Dockerfile > Dockerfile.cross
          docker buildx create --use --name release-builder
          docker buildx build \
            --push \
            --platform linux/amd64,linux/arm64 \
            --tag "ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}" \
            -f Dockerfile.cross .

  chart:
    name: Publish Helm chart
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Verify the chart CRDs are in sync
        run: |
          make helm-sync-crds
          git diff --exit-code dist/chart

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package the chart
        # Chart version is the tag without the v prefix (Helm requires bare
        # semver); appVersion keeps the v so the default manager image tag
        # matches the pushed image.
        run: |
          helm package dist/chart \
            --version "${GITHUB_REF_NAME#v}" \
            --app-version "${GITHUB_REF_NAME}"

      - name: Push the chart
        run: helm push "fs-operator-${GITHUB_REF_NAME#v}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
